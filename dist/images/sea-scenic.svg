<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="A calm scenic sea at sunset">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c9ad"/>
      <stop offset="0.48" stop-color="#f3ddd0"/>
      <stop offset="1" stop-color="#8fb4bd"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d98a4"/>
      <stop offset="1" stop-color="#173e50"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4cf" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f0b878" stop-opacity=".15"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
