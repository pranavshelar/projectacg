  <path d="M0 655 C180 615 315 680 500 640 S800 620 980 660 S1110 685 1200 645" fill="none" stroke="#c7e2e5" stroke-opacity=".26" stroke-width="7"/>
  <path d="M0 755 C200 710 340 775 530 735 S850 720 1030 760 S1140 775 1200 750" fill="none" stroke="#e0eef0" stroke-opacity=".18" stroke-width="6"/>
  <path d="M0 500 C110 470 170 475 250 500 C175 495 115 515 0 535 Z" fill="#315b65" opacity=".55"/>
  <path d="M950 500 C1010 455 1060 465 1120 500 C1080 485 1015 492 950 520 Z" fill="#315b65" opacity=".48"/>
